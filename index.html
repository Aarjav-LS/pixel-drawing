<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <script src="script.js"></script>
    <title>Document</title>
  </head>
  <body>
    <div class="container">
      <div class="grid"></div>
    </div>
    <div class="palette">
      <div class="brush-sizes">
        <div class="brush-size active" data-size="1">1</div>
        <div class="brush-size" data-size="2">2</div>
        <div class="brush-size" data-size="3">3</div>
        <div class="brush-size" data-size="4">4</div>
        <div class="brush-size" data-size="5">5</div>
        <div class="brush-size" data-size="6">6</div>
      </div>
      <div class="color" data-color="yellow"></div>
      <div class="color" data-color="red"></div>
      <div class="color" data-color="blue"></div>
      <div class="color" data-color="white"></div>
      <div class="color" data-color="green"></div>
      <div class="color" data-color="black"></div>
    </div>
  </body>
</html>
